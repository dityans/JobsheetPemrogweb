<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <section class="login-card">
            <h1 class="login-h1">SIMPUS-Mini</h1>
            <h2>Login Petugas</h2>

            <!-- Form Login -->
            <form action="index.html" method="POST" class="login-form">
                <p class="form-group">
                    <label for="username">Username </label><br>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </p>
                <p class="form-group">
                    <label for="password">Password </label><br>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </p>
                <button type="submit" class="btn-login">Masuk</button>
            </form>
            <p class="register-link">
                Belum punya akun? <a href="register.html">Daftar di sini</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
